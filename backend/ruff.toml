target-version = "py312"
line-length = 88
extend-exclude = ["booking/migrations"]

[lint]
# E/F: 基本的な誤り、I: import の並び順、B: バグになりやすい書き方、UP: 古い書き方、DJ: Django 固有のルール
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = [
    "E501",  # 行の長さは formatter に任せる
    "B904",  # 「見つからない」例外を API の 404 に置き換える箇所では、元の例外を連鎖させない
]

