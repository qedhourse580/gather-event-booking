name: application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gather
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gather -d gather"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: gather
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python -m pytest
      - run: python manage.py spectacular --file schema.yaml --validate --fail-on-warn
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gather
          POSTGRES_USER: gather
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gather -d gather"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: gather
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: python backend/manage.py migrate --noinput
      - run: python backend/manage.py seed_demo
      - run: python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/gather-backend.log 2>&1 &
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: frontend/test-results/
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: container-ci-only-password
      DJANGO_SECRET_KEY: container-ci-only-secret-replace-for-production
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - run: docker compose run --rm backend python manage.py migrate --noinput
      - run: docker compose up -d --wait
      - run: curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/api/health/
      - run: curl --fail http://127.0.0.1:8080/
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
